<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #map { width: 100%; height: 100%; background: #1c261e; }
        .leaflet-control-attribution { display: none !important; }
        .leaflet-control-zoom { display: none !important; }
        
        /* Custom Google Find My Device Pin */
        .find-my-pin {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        .pin-pulse {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(33, 150, 243, 0.35);
            border: 2px solid rgba(33, 150, 243, 0.8);
            animation: mapPulse 2s infinite ease-in-out;
            pointer-events: none;
            top: -24px;
            left: -24px;
        }
        @keyframes mapPulse {
            0% { transform: scale(0.65); opacity: 0.8; }
            50% { transform: scale(1.35); opacity: 0.18; }
            100% { transform: scale(0.65); opacity: 0.8; }
        }
        .pin-bubble {
            width: 52px;
            height: 52px;
            background: #ffffff;
            border-radius: 50%;
            border: 3px solid #1976D2;
            box-shadow: 0 6px 18px rgba(0,0,0,0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .pin-bubble svg {
            width: 28px;
            height: 28px;
            fill: #1976D2;
        }
        .pin-pointer {
            width: 12px;
            height: 12px;
            background: #1976D2;
            border: 2px solid #ffffff;
            border-radius: 50%;
            margin-top: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var satLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 21,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        var streetLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        var map = L.map('map', {
            center: [22.5726, 88.3639],
            zoom: 17,
            zoomControl: false,
            attributionControl: false,
            layers: [satLayer]
        });

        var pinHtml = '<div class="find-my-pin" onclick="if(window.AndroidBridge) AndroidBridge.onMarkerClicked();">' +
                      '  <div class="pin-pulse"></div>' +
                      '  <div class="pin-bubble">' +
                      '    <svg viewBox="0 0 24 24">' +
                      '      <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>' +
                      '    </svg>' +
                      '  </div>' +
                      '  <div class="pin-pointer"></div>' +
                      '</div>';

        var pinIcon = L.divIcon({
            html: pinHtml,
            className: '',
            iconSize: [52, 64],
            iconAnchor: [26, 62]
        });

        var marker = L.marker([22.5726, 88.3639], { icon: pinIcon }).addTo(map);

        window.updateDeviceLocation = function(lat, lon, name) {
            if (map && marker) {
                map.flyTo([lat, lon], 17, { animate: true, duration: 1.0 });
                marker.setLatLng([lat, lon]);
            }
        };

        window.mapZoomIn = function() {
            if (map) map.zoomIn();
        };

        window.mapZoomOut = function() {
            if (map) map.zoomOut();
        };

        window.recenterMap = function(lat, lon) {
            if (map) map.flyTo([lat, lon], 17, { animate: true, duration: 0.8 });
        };

        window.toggleMapLayer = function(isSat) {
            if (map) {
                if (isSat) {
                    map.removeLayer(streetLayer);
                    map.addLayer(satLayer);
                } else {
                    map.removeLayer(satLayer);
                    map.addLayer(streetLayer);
                }
            }
        };
    </script>
</body>
</html>
